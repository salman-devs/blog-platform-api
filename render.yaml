databases:
  - name: blog-db
    databaseName: blog_db
    user: blog_user
    plan: free

services:
  - type: web
    name: blog-backend
    plan: free
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: blog-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60

  - type: web
    name: blog-frontend
    plan: free
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://blog-platform-api-rfa3.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html